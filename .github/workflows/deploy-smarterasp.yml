name: Deploy to SmarterASP

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ecommerceplatform.client/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Angular dependencies
        working-directory: ecommerceplatform.client
        run: npm ci

      - name: Build Angular
        working-directory: ecommerceplatform.client
        run: npm run build -- --configuration production

      - name: Copy Angular output to wwwroot
        run: |
          SOURCE="ecommerceplatform.client/dist/ecommerceplatform.client/browser"
          TARGET="ECommercePlatform.Server/wwwroot"
          if [ ! -d "$SOURCE" ]; then
            echo "Angular build output not found at $SOURCE"
            exit 1
          fi
          mkdir -p "$TARGET"
          cp -r "$SOURCE"/. "$TARGET"/

      - name: Publish ASP.NET app
        run: >
          dotnet publish ECommercePlatform.Server/ECommercePlatform.Server.csproj
          -c Release
          --self-contained false
          -o ./publish
          /p:SkipSpaProjectReference=true
          /p:AspNetCoreHostingModel=OutOfProcess

      - name: Write production settings
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          python3 - <<'PY'
          import json, os
          settings = {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "Cache": {
              "UseMemoryCache": True
            },
            "ConnectionStrings": {
              "DefaultConnection": os.environ["DB_CONNECTION_STRING"]
            }
          }
          with open("./publish/appsettings.Production.json", "w", encoding="utf-8") as f:
            json.dump(settings, f, indent=2)
          PY

      - name: Configure web.config for SmarterASP
        run: |
          mkdir -p ./publish/logs
          python3 - <<'PY'
          from pathlib import Path
          web_config = Path("./publish/web.config")
          content = """<?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <location path="." inheritInChildApplications="false">
              <system.webServer>
                <handlers>
                  <add name="aspNetCore" path="*" verb="*" modules="AspNetCoreModuleV2" resourceType="Unspecified" />
                </handlers>
                <aspNetCore processPath="dotnet" arguments=".\\ECommercePlatform.Server.dll" stdoutLogEnabled="true" stdoutLogFile=".\\logs\\stdout" hostingModel="outofprocess">
                  <environmentVariables>
                    <environmentVariable name="ASPNETCORE_ENVIRONMENT" value="Production" />
                  </environmentVariables>
                </aspNetCore>
                <httpErrors errorMode="Detailed" />
              </system.webServer>
            </location>
            <system.web>
              <customErrors mode="Off" />
            </system.web>
          </configuration>
          """
          cleaned = "\n".join(line.lstrip() for line in content.strip().splitlines()) + "\n"
          web_config.write_text(cleaned, encoding="utf-8")
          PY

      - name: Remove local photos from publish output
        run: |
          rm -rf ./publish/wwwroot/images
          rm -rf ./publish/wwwroot/assets/images
          find ./publish -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mov' \) -delete || true

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ./site1/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/wwwroot/images/**
            **/wwwroot/assets/images/**
            **/*.jpg
            **/*.jpeg
            **/*.png
            **/*.gif
            **/*.webp
            **/*.mp4
            **/*.webm
            **/*.mov
            **/logs/**
