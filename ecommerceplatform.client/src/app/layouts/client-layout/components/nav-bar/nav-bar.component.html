<header class="site-header">
  @if (companyService.hasSocialLinks()) {
    <div class="header-top">
      <div class="container">
        <div class="header-top-inner">
          <div class="header-social">
            @if (companyService.facebookUrl()) {
              <a
                [href]="companyService.facebookUrl()"
                class="social-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook">
                <i class="bi bi-facebook"></i>
              </a>
            }
            @if (companyService.instagramUrl()) {
              <a
                [href]="companyService.instagramUrl()"
                class="social-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram">
                <i class="bi bi-instagram"></i>
              </a>
            }
            @if (companyService.snapchatUrl()) {
              <a
                [href]="companyService.snapchatUrl()"
                class="social-link"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Snapchat">
                <i class="bi bi-snapchat"></i>
              </a>
            }
            @if (companyService.phoneHref()) {
              <a
                [href]="companyService.phoneHref()"
                class="social-link"
                aria-label="Phone">
                <i class="bi bi-telephone"></i>
              </a>
            }
          </div>
        </div>
      </div>
    </div>
  }

  <div class="header-main">
    <div class="container">
      <div class="header-main-inner">
        <a class="brand" [routerLink]="['/home']">
          <img [src]="companyService.logoUrl()" [alt]="companyService.companyName()" class="brand-logo">
          <span class="brand-name">{{ companyService.companyName() }}</span>
        </a>

        <div class="search-wrapper">
          <form class="search-form" (submit)="onSearchSubmit($event)">
            <input
              class="search-input"
              type="search"
              placeholder="Search products..."
              aria-label="Search"
              [value]="searchTerm()"
              (input)="onSearchInput($event)" />
            <button class="search-btn" type="submit" aria-label="Search">
              <i class="bi bi-search"></i>
            </button>
          </form>
        </div>

        <div class="header-actions">
          <button type="button" class="header-action" (click)="openCart()">
            <span class="action-icon-wrap">
              <i class="bi bi-cart3"></i>
              @if (cartItemCount() > 0) {
                <span class="action-badge">{{ cartItemCount() }}</span>
              }
            </span>
            <span class="action-label">Cart</span>
          </button>
        </div>

        <button
          class="mobile-toggle"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#headerNav"
          aria-controls="headerNav"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <i class="bi bi-list"></i>
        </button>
      </div>
    </div>
  </div>

  <nav class="header-nav">
    <div class="container">
      <div class="collapse navbar-collapse" id="headerNav">
        <ul class="nav-links">
          <li class="nav-links-item">
            <a class="nav-links-link" [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
          </li>
          <li class="nav-links-item">
            <a class="nav-links-link" [routerLink]="['/categories']" routerLinkActive="active">Categories</a>
          </li>
          <li class="nav-links-item">
            <a class="nav-links-link" [routerLink]="['/products']" routerLinkActive="active">Products</a>
          </li>
          <li class="nav-links-item">
            <a class="nav-links-link" [routerLink]="['/sub-categories']" routerLinkActive="active">Sub Categories</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
