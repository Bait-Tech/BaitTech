<div class="grid">
  <div class="col-12">
    <p-toast></p-toast>

    <app-admin-page-header title="Categories" icon="pi pi-sitemap"
      subtitle="Manage your product categories">
      <button pButton pRipple label="New" icon="pi pi-plus" class="p-button-success"
      (click)="openNew()"></button>
      <button pButton pRipple label="Delete" icon="pi pi-trash" class="p-button-danger p-button-outlined"
        (click)="deleteSelectedCategories()"
      [disabled]="!selectedCategories || !selectedCategories.length"></button>
    </app-admin-page-header>

    <div class="card">
      @if (loading()) {
        <div class="table-loading">
          <i class="pi pi-spin pi-spinner"></i>
        </div>
      } @else {
        <p-table #dt [value]="categories()" [rows]="pageSize" [first]="tableFirst()" [paginator]="true" [globalFilterFields]="['name']"
          [(selection)]="selectedCategories" selectionMode="multiple" [rowHover]="true" dataKey="id"
          (onPage)="onTablePage($event)"
          currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [showCurrentPageReport]="true">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 3rem">
              <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
            </th>
            <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
            <th>Image</th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-category>
          <tr>
            <td>
              <p-tableCheckbox [value]="category"></p-tableCheckbox>
            </td>
            <td>{{category.name}}</td>
            <td style="width: 14%; min-width: 10rem;">
              <img [src]="category.imageUrl" [alt]="category.name" width="100" class="shadow-4" />
            </td>
            <td>
              <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
              (click)="editCategory(category)"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
      }
    </div>

    <app-side-panel
      [visible]="categoryPanelVisible()"
      [title]="panelTitle()"
      [subtitle]="panelSubtitle()"
      [icon]="panelIcon()"
      width="32rem"
      (visibleChange)="onPanelVisibleChange($event)">
      <div class="admin-panel-form">
        <div class="form-section-card">
          <div class="form-section-header">
            <span class="form-section-icon">
              <i class="pi pi-tag"></i>
            </span>
            <div class="form-section-heading">
              <h3 class="form-section-title">Category Details</h3>
              <p class="form-section-desc">Name and display image for the category</p>
            </div>
          </div>

          <div class="form-section-content">
            <div class="form-field">
              <label for="name">Category Name</label>
              <input
                type="text"
                pInputText
                id="name"
                [(ngModel)]="category.name"
                placeholder="e.g. Electronics"
                class="form-control-full"
                [ngClass]="{'ng-invalid ng-dirty': submitted && !category.name.trim()}" />
              @if (submitted && !category.name.trim()) {
                <small class="field-error">Category Name is required</small>
              }
            </div>

            <div class="form-field">
              <label>Category Image</label>
              <input
                #imageInput
                type="file"
                accept="image/*"
                class="image-upload-input"
                (change)="onImageInputChange($event)" />
              <button type="button" class="image-upload-zone" (click)="imageInput.click()">
                <span class="image-upload-icon">
                  <i class="pi pi-cloud-upload"></i>
                </span>
                <span class="image-upload-title">Click to upload image</span>
                <span class="image-upload-hint">PNG or JPG, max 1MB</span>
              </button>

              <span class="image-url-divider">Or paste image URL</span>

              <div class="image-url-row">
                <input
                  type="url"
                  pInputText
                  [ngModel]="category.imageUrl"
                  (ngModelChange)="onImageUrlInput($event)"
                  placeholder="https://example.com/image.jpg"
                  class="form-control-full" />
              </div>

              @if (imagePreview()) {
                <div class="image-preview-card">
                  <img [src]="imagePreview()" [alt]="category.name" />
                </div>
              }
            </div>
          </div>
        </div>
      </div>

      <div panelFooter class="admin-panel-footer">
        <button
          pButton
          pRipple
          type="button"
          label="Cancel"
          icon="pi pi-times"
          class="p-button-outlined p-button-secondary"
          [disabled]="saving()"
          (click)="hidePanel()">
        </button>
        <p-button
          [label]="saveButtonLabel()"
          icon="pi pi-check"
          [loading]="saving()"
          (onClick)="saveCategory()">
        </p-button>
      </div>
    </app-side-panel>

    <app-admin-confirm-panel
      [visible]="deletePanelVisible()"
      title="Delete Categories"
      subtitle="This action cannot be undone"
      message="Are you sure you want to delete the selected categories?"
      confirmLabel="Delete"
      cancelLabel="Cancel"
      (visibleChange)="onDeletePanelVisibleChange($event)"
      (confirmed)="confirmDeleteSelected()">
    </app-admin-confirm-panel>
  </div>
</div>
