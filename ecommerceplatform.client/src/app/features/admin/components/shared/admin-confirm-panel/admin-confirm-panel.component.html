<app-side-panel
  [visible]="visible"
  [title]="title"
  [subtitle]="subtitle"
  icon="pi pi-exclamation-triangle"
  width="28rem"
  (visibleChange)="onPanelVisibleChange($event)">
  <div class="confirm-panel-content">
    <span class="confirm-panel-icon">
      <i class="pi pi-exclamation-triangle"></i>
    </span>
    <p class="confirm-panel-message">{{ message }}</p>
  </div>

  <div panelFooter class="admin-panel-footer">
    <button
      pButton
      pRipple
      type="button"
      [label]="cancelLabel"
      icon="pi pi-times"
      class="p-button-outlined p-button-secondary"
      [disabled]="loading"
      (click)="onCancelClick()">
    </button>
    <p-button
      [label]="confirmLabel"
      icon="pi pi-check"
      severity="danger"
      [loading]="loading"
      (onClick)="onConfirmClick()">
    </p-button>
  </div>
</app-side-panel>
