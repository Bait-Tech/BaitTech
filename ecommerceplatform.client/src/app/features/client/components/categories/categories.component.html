<div class="categories-page">
  <section class="page-header">
    <div class="container">
      <h1 class="page-title">Categories</h1>
      <p class="page-subtitle">Browse all product categories</p>
    </div>
  </section>

  <div class="container page-body">
    <div class="search-panel">
      <form class="search-form" (submit)="onSearchSubmit($event)">
        <i class="bi bi-search search-icon"></i>
        <input
          class="search-input"
          type="search"
          placeholder="Search categories..."
          aria-label="Search categories"
          [value]="searchTerm()"
          (input)="onSearchInput($event)" />
      </form>
    </div>

    @if (loading()) {
      <div class="state-panel">
        <div class="state-spinner"></div>
        <p class="state-text">Loading categories...</p>
      </div>
    }

    @if (loadError()) {
      <div class="state-panel">
        <i class="bi bi-exclamation-circle state-icon"></i>
        <p class="state-text">Failed to load categories</p>
        <button type="button" class="state-action" (click)="retryLoad()">Try Again</button>
      </div>
    }

    @if (!loading() && !loadError()) {
      <div class="categories-grid">
        @for (category of filteredCategories(); track category.id) {
          <button type="button" class="category-card" (click)="goToSubCategories(category.id)">
            <div class="category-image-wrap">
              <img [src]="category.imageUrl" [alt]="category.name" class="category-image">
            </div>
            <div class="category-body">
              <h2 class="category-name">{{ category.name }}</h2>
              <span class="category-action">
                View Sub Categories
                <i class="bi bi-arrow-right"></i>
              </span>
            </div>
          </button>
        }
      </div>
    }

    @if (showEmptyState()) {
      <div class="state-panel">
        <i class="bi bi-grid state-icon"></i>
        <p class="state-text">No categories found</p>
      </div>
    }
  </div>
</div>
