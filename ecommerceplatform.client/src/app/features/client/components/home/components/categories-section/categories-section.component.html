<section class="categories-section">
  <div class="container">
    <div class="section-panel">
      <div class="section-header">
        <h2 class="section-title">Our Best Categories</h2>
        <button type="button" class="section-action" (click)="onSeeAllClick()">See All</button>
      </div>

      <div class="categories-track">
        @for (category of categories(); track category.id) {
          <button type="button" class="category-card" (click)="onCategoryClick(category.id)">
            <div class="category-image-wrap">
              <img [src]="category.imageUrl" [alt]="category.name" class="category-image">
            </div>
            <span class="category-name">{{ category.name }}</span>
          </button>
        }
      </div>
    </div>
  </div>
</section>
