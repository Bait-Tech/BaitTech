@if (hasHeroImages()) {
  <section class="hero-section">
    <div class="hero-carousel-container">
      <div id="homeHeroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
          @for (image of heroImages(); track image.id; let i = $index) {
            <div class="carousel-item" [class.active]="i === initialActiveIndex()">
              <div class="carousel-image-container">
                @if (image.linkUrl) {
                  <a [href]="image.linkUrl" class="carousel-link">
                    <img [src]="image.imageUrl" class="carousel-img" alt="Hero banner">
                  </a>
                }
                @if (!image.linkUrl) {
                  <img [src]="image.imageUrl" class="carousel-img" alt="Hero banner">
                }
              </div>
            </div>
          }
        </div>

        @if (heroImages().length > 1) {
          <div class="carousel-indicators custom-indicators">
            @for (image of heroImages(); track image.id; let i = $index) {
              <button
                type="button"
                data-bs-target="#homeHeroCarousel"
                [attr.data-bs-slide-to]="i"
                [class.active]="i === initialActiveIndex()"
                [attr.aria-current]="i === initialActiveIndex() ? 'true' : null"
                [attr.aria-label]="'Slide ' + (i + 1)">
              </button>
            }
          </div>

          <button class="carousel-control-prev carousel-nav-btn" type="button" data-bs-target="#homeHeroCarousel" data-bs-slide="prev">
            <i class="bi bi-chevron-left"></i>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next carousel-nav-btn" type="button" data-bs-target="#homeHeroCarousel" data-bs-slide="next">
            <i class="bi bi-chevron-right"></i>
            <span class="visually-hidden">Next</span>
          </button>
        }
      </div>
    </div>
  </section>
}
